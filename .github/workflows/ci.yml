name: CI

on:
  push:
    branches: [ rabbi, main ]
  pull_request:
    branches: [ rabbi, main ]

jobs:
  server-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'
          cache-dependency-path: yarn.lock
      - name: Install dependencies
        # Falls back to a plain install if no lockfile has been committed yet;
        # commit yarn.lock to make CI fully reproducible.
        run: |
          if [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
          else
            yarn install
          fi
      - name: Typecheck
        run: yarn typecheck
      - name: Lint
        run: yarn lint
      - name: Test
        run: yarn test
